<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sky Courier: a 2D canvas bush-plane game. Fly the mail run across the islands, thread the rings, and land on the far runway.">
<title>Sky Courier — Island Mail Run</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1626; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sky Courier: fly the mail plane across the islands, through the rings, and land on the far runway"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./main.js"></script>
</body>
</html>
